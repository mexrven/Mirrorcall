
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MirrorCall</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #10131b;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 28px 18px;
}
h1 { color: #ff83a6; font-size: 34px; }
p { color: #b9c0ce; }
video, canvas {
  width: 100%;
  max-width: 440px;
  border-radius: 18px;
  background: #242936;
  margin-top: 18px;
}
button {
  border: 0;
  border-radius: 12px;
  padding: 14px 22px;
  margin: 10px 4px;
  font-size: 16px;
  background: #ff83a6;
  color: #17121a;
  font-weight: bold;
}
#status { margin-top: 18px; }
</style>
</head>
<body>

<h1>MirrorCall ❤️</h1>
<p>A little video calling project for two people.</p>

<video id="camera" autoplay playsinline muted hidden></video>
<canvas id="screen" width="640" height="480"></canvas>

<div>
  <button id="start">Start Camera</button>
  <button id="flip">Flip Mirror</button>
</div>

<p id="status">Camera not started yet.</p>

<script>
const camera = document.getElementById("camera");
const screen = document.getElementById("screen");
const ctx = screen.getContext("2d");
const status = document.getElementById("status");

let stream;
let mirrored = true;

document.getElementById("start").onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" },
      audio: true
    });

    camera.srcObject = stream;
    await camera.play();

    status.textContent = "Camera connected! ❤️";
    drawFrame();
  } catch (error) {
    status.textContent = "Camera error: " + error.message;
  }
};

function drawFrame() {
  if (!stream) return;

  ctx.save();
  ctx.clearRect(0, 0, 640, 480);

  if (mirrored) {
    ctx.translate(640, 0);
    ctx.scale(-1, 1);
  }

  ctx.drawImage(camera, 0, 0, 640, 480);
  ctx.restore();

  requestAnimationFrame(drawFrame);
}

document.getElementById("flip").onclick = () => {
  mirrored = !mirrored;
  status.textContent = mirrored
    ? "Mirror mode ON ❤️"
    : "Mirror mode OFF";
};
</script>

</body>
</html>
